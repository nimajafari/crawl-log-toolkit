# nginx log formats that crawl-log-toolkit's `parse` understands.
#
# Two options are provided:
#   1. `combined`  - the stock NCSA Combined format (parse: --format combined).
#   2. `seo_json`  - RECOMMENDED. A structured JSON line whose keys match the
#                    parser exactly, and which adds $request_time and $host that
#                    the Combined format omits (so response-time percentiles and
#                    multi-host analysis work). parse: --format nginx_json (or auto).
#
# Put these `log_format` blocks in the `http {}` context and reference one from
# an `access_log` directive in your `server {}`.

http {
    # ---- Option 1: NCSA Combined (works, but no request_time / host) --------
    log_format combined_seo
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    # ---- Option 2: structured JSON (recommended) ----------------------------
    # escape=json keeps embedded quotes/control chars from breaking the line.
    # The KEY NAMES below are exactly what crawl_log_toolkit/parse.py reads.
    log_format seo_json escape=json
        '{'
            '"time_iso8601":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"host":"$host",'
            '"request_uri":"$request_uri",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":"$request_time"'
        '}';

    server {
        listen 80;
        server_name shop.example.com;

        # Use ONE of these. The JSON log is what the bundled sample data mimics.
        # access_log /var/log/nginx/access.log combined_seo;
        access_log /var/log/nginx/access.seo.json.log seo_json;

        # Tip: ship the file with your CDN/agent (Vector, Datadog, etc.) — see
        # ../dashboards/ for reference configs. Prefer CDN edge logs over origin
        # logs so cache hits served to crawlers are not missed.
    }
}
