# Apache httpd log formats that crawl-log-toolkit's `parse` understands.
#
# Place in your httpd.conf / vhost. `combined` is the standard NCSA Combined
# format (parse: --format combined, or just auto-detect). `seo` adds the host
# (%v) and the response time in SECONDS (%T) so multi-host analysis and
# response-time percentiles work.
#
# NOTE on %T vs %D:
#   %T = seconds (what the parser's combined request_time extension expects).
#   %D = microseconds. If you must use %D, divide by 1e6 before analysis.

# ---- Standard Combined (works out of the box with --format combined) --------
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

# ---- SEO-friendly: prepend host, append response time in seconds ------------
# The trailing numeric %T is read as request_time by the combined parser.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %T" seo

<VirtualHost *:80>
    ServerName shop.example.com

    # Use ONE of these.
    # CustomLog /var/log/apache2/access.log combined
    CustomLog /var/log/apache2/access.seo.log seo
</VirtualHost>

# Prefer CDN edge logs (Cloudflare Logpush / Fastly / CloudFront) over origin
# logs when you can: origin logs miss everything served from cache, which is
# exactly the content crawlers often receive.
