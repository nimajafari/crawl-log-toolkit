[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-log-toolkit"
version = "0.1.0"
description = "Turn raw web-server / CDN access logs into verified search-crawler analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "crawl-log-toolkit contributors" }]
keywords = ["seo", "googlebot", "crawl-budget", "log-analysis", "duckdb", "crawler-verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "duckdb>=0.10",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
sitemap = ["lxml>=4.9"]

[project.urls]
Homepage = "https://github.com/your-org/crawl-log-toolkit"
Issues = "https://github.com/your-org/crawl-log-toolkit/issues"

[project.scripts]
crawl-log = "crawl_log_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["crawl_log_toolkit*"]

[tool.setuptools.package-data]
crawl_log_toolkit = ["data/ipranges/*.json", "queries/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
